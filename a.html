<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Меню - Экран 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; overflow: hidden; }
        body, html { width: 100vw; height: 100vh; background-color: #fff; color: #2c3e72; }

        /* Новая надежная сетка на Flexbox */
        .menu-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .side-column {
            width: 38%;
            height: 100%;
            padding: 40px 50px;
            position: relative; 
            display: flex;
            flex-direction: column;
        }
        .center-column {
            width: 24%;
            height: 100%;
            background-color: #ffcc00;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-column img, .center-column video {
            width: 100%; height: 100%; object-fit: cover; display: none;
        }

        .category-block { margin-bottom: 35px; }
        .category-header { display: flex; width: 100%; margin-bottom: 15px; }
        .category-title { 
            font-size: 28px; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 1px; text-align: left;
        }

        .menu-item { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; margin-bottom: 16px; font-size: 18px; }
        .item-name-block { flex: 1; text-align: left; }
        .item-name { font-weight: bold; color: #2c3e72; }
        
        .item-description { 
            font-size: 13px; 
            color: #657195; 
            margin-top: 4px; 
            font-weight: normal; 
            line-height: 1.2;
            padding-right: 15px;
        }
        
        .item-prices-block { display: flex; justify-content: flex-end; font-weight: 900; color: #2c3e72; padding-top: 2px; }
        .price-single { display: block; width: 65px; text-align: right; margin-left: 15px; }
        .price-single .vol-label { display: block; font-size: 11px; color: #888; font-weight: normal; margin-bottom: 2px; }

        .no-category-item { margin-top: 25px; margin-bottom: 25px; }
        .no-category-item .item-name { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .no-category-item .price-single { font-size: 24px; width: 75px; }
        .no-category-item .price-single .vol-label { font-size: 13px; font-weight: bold; color: #2c3e72; }
        .no-category-item .item-description { font-size: 14px; margin-top: 6px; }

        /* ЖЕСТКАЯ ФИКСАЦИЯ ДОБАВОК ВНИЗУ */
        .addons-block {
            position: absolute;
            bottom: 40px;
            left: 50px;
            right: 50px;
            background: #fff;
            padding-top: 15px;
            border-top: 2px dashed #2c3e72;
            margin-bottom: 0;
        }
        .addons-block .category-title { font-size: 22px; color: #2c3e72; margin-bottom: 10px; }
        .addon-item { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 8px; }
        .addon-item .item-name { font-weight: normal; color: #555c70; }
        .addon-item .addon-price { font-weight: bold; color: #2c3e72; }

        #hint { position: absolute; top: 10px; right: 10px; color: rgba(0,0,0,0.2); font-size: 10px; z-index: 999; cursor: pointer; }
    </style>
</head>
<body onclick="openFullscreen();">
    <div id="hint">Нажмите OK для во весь экран</div>

    <div class="menu-container">
        <div class="side-column" id="left-column"></div>
        <div class="center-column" id="media-block">
            <video id="menu-video" autoplay loop muted playsinline></video>
            <img id="menu-img" alt="menu media">
        </div>
        <div class="side-column" id="right-column"></div>
    </div>

    <script>
        const SCREEN_NAME = 'screen1'; 
        const GOOGLE_CSV_URL = SCREEN_NAME === 'screen1' 
            ? 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuDg_XrAX0YMtbUpwkVOJ3aBWOCKmqELqfqpLB3tcpmSgq5IEKqmZPaEvPma-ZUHGPILwitDcS4nx1/pub?gid=0&single=true&output=csv' 
            : 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuDg_XrAX0YMtbUpwkVOJ3aBWOCKmqELqfqpLB3tcpmSgq5IEKqmZPaEvPma-ZUHGPILwitDcS4nx1/pub?gid=212811701&single=true&output=csv';

        function openFullscreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            document.getElementById('hint').style.display = 'none';
        }

        function loadMedia() {
            const video = document.getElementById('menu-video');
            const img = document.getElementById('menu-img');
            const timestamp = new Date().getTime();
            const basePath = SCREEN_NAME === 'screen1' ? 'screen1/menu_media' : 'screen2/menu_media';

            const testVideo = document.createElement('video');
            testVideo.src = `${basePath}.mp4?t=${timestamp}`;
            testVideo.oncanplaythrough = function() {
                video.src = testVideo.src; video.style.display = 'block'; img.style.display = 'none';
            };
            testVideo.onerror = function() {
                const testGif = new Image();
                testGif.src = `${basePath}.gif?t=${timestamp}`;
                testGif.onload = function() {
                    img.src = testGif.src; img.style.display = 'block'; video.style.display = 'none';
                };
                testGif.onerror = function() {
                    img.src = `${basePath}.png?t=${timestamp}`;
                    img.style.display = 'block'; video.style.display = 'none';
                };
            };
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
                    else { current += char; }
                }
                result.push(current);
                return result;
            });
            
            lines.shift(); 
            const categories = {};
            
            lines.forEach(cols => {
                if (cols.length >= 4 && cols[1] && cols[1].trim() !== '') {
                    let cat = cols[0].trim();
                    if (cat === '') cat = 'empty';
                    
                    const name = cols[1].trim();
                    let volume = cols[2].trim().replace(/\s+/g, ''); // чистим скрытые пробелы
                    const price = cols[3].trim();
                    const description = cols[4] ? cols[4].trim() : '';

                    // Надежное добавление "мл" (если в строке только цифры)
                    if (volume !== '' && /^\d+$/.test(volume)) {
                        volume = volume + ' мл';
                    }

                    if (!categories[cat]) categories[cat] = {};
                    
                    if (categories[cat][name]) {
                        categories[cat][name].prices.push({ volume, price });
                        if (description !== '' && categories[cat][name].description === '') {
                            categories[cat][name].description = description;
                        }
                    } else {
                        categories[cat][name] = {
                            description: description,
                            prices: [{ volume, price }]
                        };
                    }
                }
            });
            return categories;
        }

        function renderMenu(categories) {
            const leftCol = document.getElementById('left-column');
            const rightCol = document.getElementById('right-column');
            leftCol.innerHTML = ''; rightCol.innerHTML = '';

            let addonsHtml = '';
            if (categories['Добавки']) {
                addonsHtml = `<div class="category-block addons-block">`;
                addonsHtml += `<h2 class="category-title">Добавки</h2>`;
                for (const itemName in categories['Добавки']) {
                    const itemData = categories['Добавки'][itemName];
                    const price = itemData.prices[0] ? itemData.prices[0].price : '';
                    addonsHtml += `
                        <div class="addon-item">
                            <span class="item-name">${itemName}</span>
                            <span class="addon-price">${price}</span>
                        </div>`;
                }
                addonsHtml += `</div>`;
                delete categories['Добавки'];
            }

            const catNames = Object.keys(categories);
            const half = Math.ceil(catNames.length / 2);

            catNames.forEach((catName, index) => {
                let html = `<div class="category-block">`;
                
                if (catName !== 'empty') {
                    html += `
                        <div class="category-header">
                            <h2 class="category-title">${catName}</h2>
                        </div>`;
                }

                for (const itemName in categories[catName]) {
                    const itemData = categories[catName][itemName];
                    const itemClass = catName === 'empty' ? 'menu-item no-category-item' : 'menu-item';
                    
                    html += `<div class="${itemClass}">`;
                    html += `
                        <div class="item-name-block">
                            <span class="item-name">${itemName}</span>`;
                    if (itemData.description && itemData.description !== '') {
                        html += `<div class="item-description">${itemData.description}</div>`;
                    }
                    html += `</div>`;
                    
                    html += `<div class="item-prices-block">`;
                    itemData.prices.forEach(p => {
                        const volLabel = `<span class="vol-label">${p.volume}</span>`;
                        html += `<span class="price-single">${volLabel}${p.price}</span>`;
                    });
                    html += `</div></div>`;
                }
                html += `</div>`;

                if (index < half) { leftCol.innerHTML += html; } 
                else { rightCol.innerHTML += html; }
            });

            if (addonsHtml !== '') {
                rightCol.innerHTML += addonsHtml;
            }
        }

        function updateMenuData() {
            fetch(GOOGLE_CSV_URL, { cache: 'no-store' })
                .then(res => res.text())
                .then(text => {
                    const data = parseCSV(text);
                    renderMenu(data);
                })
                .catch(err => console.log('Ошибка связи с Google Sheets'));
        }

        loadMedia();
        updateMenuData();
        setInterval(updateMenuData, 2 * 60 * 1000); 
        setInterval(loadMedia, 30 * 60 * 1000);   
    </script>
</body>
</html>
