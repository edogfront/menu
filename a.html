<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Меню - Экран 1</title>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ ЭКРАНА */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; overflow: hidden; }
        body, html { width: 100vw; height: 100vh; background-color: #fff; color: #2c3e72; }

        /* Сетка: Три колонки (Левая 38%, Центр 24%, Правая 38%) */
        .menu-container {
            display: table;
            width: 100%;
            height: 100%;
            table-layout: fixed;
        }
        .column {
            display: table-cell;
            vertical-align: top;
            height: 100%;
        }
        .side-column {
            width: 38%;
            padding: 40px 50px;
            position: relative;
        }
        
        /* Центральный медиа-блок (Желтый) */
        .center-column {
            width: 24%;
            background-color: #ffcc00;
            position: relative;
            vertical-align: middle;
            text-align: center;
        }
        .center-column img, .center-column video {
            width: 100%; height: 100%; object-fit: cover; display: none;
        }

        /* ОБЫЧНЫЕ КАТЕГОРИИ И ТОВАРЫ */
        .category-block { margin-bottom: 35px; page-break-inside: avoid; }
        .category-header { display: table; width: 100%; margin-bottom: 15px; }
        .category-title { 
            font-size: 28px; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 1px; text-align: left;
        }

        .menu-item { display: table; width: 100%; margin-bottom: 16px; font-size: 18px; }
        .item-name-block { display: table-cell; text-align: left; vertical-align: top; }
        .item-name { font-weight: bold; color: #2c3e72; }
        
        /* СТИЛЬ ДЛЯ ОПИСАНИЯ СОСТАВА */
        .item-description { 
            font-size: 13px; 
            color: #657195; 
            margin-top: 4px; 
            font-weight: normal; 
            line-height: 1.2;
            padding-right: 15px;
        }
        
        .item-prices-block { display: table-cell; text-align: right; vertical-align: top; font-weight: 900; color: #2c3e72; padding-top: 2px; }
        .price-single { display: inline-block; width: 60px; text-align: right; margin-left: 10px; vertical-align: top; }
        .price-single .vol-label { display: block; font-size: 11px; color: #888; font-weight: normal; margin-bottom: 2px; }

        /* СТИЛЬ ВАРИАНТА А (Для товаров без категории) */
        .no-category-item { margin-top: 25px; margin-bottom: 25px; }
        .no-category-item .item-name { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .no-category-item .price-single { font-size: 24px; width: 70px; }
        .no-category-item .price-single .vol-label { font-size: 13px; font-weight: bold; color: #2c3e72; }
        .no-category-item .item-description { font-size: 14px; margin-top: 6px; }

        /* СТИЛЬ ДЛЯ ДОБАВОК В ПРАВОМ НИЖНЕМ УГЛУ */
        .addons-block {
            position: absolute;
            bottom: 40px;
            left: 50px;
            right: 50px;
            background: #fff;
            padding-top: 15px;
            border-top: 2px dashed #2c3e72;
            margin-bottom: 0;
        }
        .addons-block .category-title { font-size: 22px; color: #2c3e72; margin-bottom: 10px; }
        .addon-item { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 8px; }
        .addon-item .item-name { font-weight: normal; color: #555c70; }
        .addon-item .addon-price { font-weight: bold; color: #2c3e72; }

        #hint { position: absolute; top: 10px; right: 10px; color: rgba(0,0,0,0.2); font-size: 10px; z-index: 999; cursor: pointer; }
    </style>
</head>

            <img id="menu-img" alt="menu media">
        </div>

        <div class="column side-column" id="right-column"></div>
    </div>
