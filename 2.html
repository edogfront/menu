<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; background: #000; overflow: hidden; }
        body, html { width: 100%; height: 100%; display: block; }
        #menuImage { 
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: fill; border: none;
        }
        #hint { 
            position: absolute; top: 10px; right: 10px; 
            color: rgba(255,255,255,0.2); font-family: sans-serif; font-size: 10px; 
            z-index: 999;
        }
    </style>
</head>
<body onclick="openFullscreen();">
    <div id="hint">Нажмите OK для во весь экран</div>
    <img id="menuImage" src="Menu2026.jpg">

    <script>
        // Укажите имя вашего файла (gif или jpg)
        const IMG_URL = 'Menu2026.jpg';

        function openFullscreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            document.getElementById('hint').style.display = 'none';
        }

        function refreshImage() {
            const img = document.getElementById('menuImage');
            const tempImg = new Image();
            
            // Сначала загружаем картинку в фоновую память
            tempImg.onload = function() {
                // Только если она успешно загрузилась, меняем её на экране
                img.src = tempImg.src;
                console.log('Изображение успешно обновлено');
            };
            
            tempImg.onerror = function() {
                console.log('Интернет недоступен, оставляем старое изображение');
            };

            // Добавляем метку времени, чтобы обойти кэш при наличии сети
            tempImg.src = IMG_URL + '?t=' + new Date().getTime();
        }

        // Проверка обновлений каждые 30 минут
        setInterval(refreshImage, 30 * 60 * 1000);
    </script>
</body>
</html>
