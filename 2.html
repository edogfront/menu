<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
   <style>
    /* Убираем все отступы */
    * { margin: 0; padding: 0; background: #000; overflow: hidden; }
    
    body, html { 
        width: 100%; 
        height: 100%; 
        display: block;
    }

    #menuImage { 
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;   /* Строго 100% ширины окна */
        height: 100vh;  /* Строго 100% высоты окна */
        object-fit: fill; /* Игнорировать пропорции и тянуть до краев */
        border: none;
    }

    #hint { 
        position: absolute; top: 10px; right: 10px; 
        color: rgba(255,255,255,0.2); font-family: sans-serif; font-size: 10px; 
        z-index: 999;
    }
</style>
</head>
<body onclick="openFullscreen();">
    <div id="hint">Нажмите OK для во весь экран</div>
    <img id="menuImage" src="Menu2026.jpg">

    <script>
        const IMG_URL = 'Menu2026.jpg';

        function openFullscreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            document.getElementById('hint').style.display = 'none';
        }

        // Обновление GIF без потери анимации
        function refreshGif() {
            const img = document.getElementById('menuImage');
            const newSrc = IMG_URL + '?t=' + new Date().getTime();
            img.src = newSrc;
        }

        // Проверка обновления каждые 30 минут
        setInterval(refreshGif, 1800000);

        // Перезагрузка в 4 утра
        setInterval(function() {
            const now = new Date();
            if (now.getHours() === 4 && now.getMinutes() === 0) {
                location.reload();
            }
        }, 60000);
    </script>
</body>
</html>
