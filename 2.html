<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="900"> 
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; cursor: pointer; }
        img { width: 100vw; height: 100vh; object-fit: contain; }
        /* Coffe Pei */
        #hint { 
            position: absolute; top: 10px; right: 10px; 
            color: rgba(255,255,255,0.3); font-family: sans-serif; font-size: 12px; 
        }
    </style>
</head>
<body onclick="openFullscreen();">
    <div id="hint">Нажмите OK для во весь экран</div>
    <img src="Menu2026.gif">

    <script>
        function openFullscreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari/Old TVs */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
            document.getElementById('hint').style.display = 'none';
        }
    </script>
</body>
</html>
