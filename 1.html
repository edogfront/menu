<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; background: #000; overflow: hidden; }
        body { width: 100vw; height: 100vh; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #hint { 
            position: absolute; top: 10px; right: 10px; 
            color: rgba(255,255,255,0.2); font-family: sans-serif; font-size: 10px; 
        }
    </style>
</head>
<body onclick="openFullscreen();">
    <div id="hint">Нажмите OK для во весь экран</div>
    <img id="menuImage" src="Menu_hotdog2026.gif">

    <script>
        const IMG_URL = 'Menu_hotdog2026.gif';

        function openFullscreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            document.getElementById('hint').style.display = 'none';
        }

        // Функция мягкого обновления для GIF
        function refreshGif() {
            const img = document.getElementById('menuImage');
            const downloadAnchor = new Image();
            
            // Предзагрузка новой версии в фоне
            downloadAnchor.onload = function() {
                img.src = downloadAnchor.src;
            };
            downloadAnchor.src = IMG_URL + '?t=' + new Date().getTime();
        }

        // Проверка обновления раз в 30 минут
        setInterval(refreshGif, 30 * 60 * 1000);

        // Полная перезагрузка страницы в 4 утра для стабильности
        setInterval(function() {
            const now = new Date();
            if (now.getHours() === 4 && now.getMinutes() === 0) {
                location.reload();
            }
        }, 60000);
    </script>
</body>
</html>
