<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; overflow: hidden; }
        body, html { width: 100vw; height: 100vh; background-color: #fff; color: #2c3e72; }
        .menu-container { display: flex; width: 100%; height: 100%; }
        .side-column { width: 38%; height: 100%; padding: 40px; }
        .center-column { width: 24%; background-color: #ffcc00; }
        .category-block { margin-bottom: 25px; }
        .category-title { font-size: 28px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .menu-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .item-name { font-weight: bold; }
        .item-description { font-size: 12px; color: #666; }
        .price-item { margin-left: 10px; font-weight: 900; }
        .vol-label { font-size: 11px; color: #999; display: block; }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="side-column" id="left-col"></div>
        <div class="center-column"></div>
        <div class="side-column" id="right-col"></div>
    </div>

    <script>
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuDg_XrAX0YMtbUpwkVOJ3aBWOCKmqELqfqpLB3tcpmSgq5IEKqmZPaEvPma-ZUHGPILwitDcS4nx1/pub?gid=212811701&single=true&output=csv&t=' + Date.now();

        fetch(URL).then(r => r.text()).then(text => {
            const lines = text.split(/\r?\n/).slice(1);
            const menu = {}; // Структура: { "Категория": { "Товар": [цены] } }

            lines.forEach(line => {
                const [cat, name, vol, price, desc] = line.split(',').map(s => s.trim());
                if (!name) return;
                
                // Если ячейка категории пустая, называем её именем товара, чтобы она стала заголовком
                const category = cat === "" ? name : cat;
                
                if (!menu[category]) menu[category] = { items: {}, isSingle: cat === "" };
                if (!menu[category].items[name]) menu[category].items[name] = { desc, prices: [] };
                
                menu[category].items[name].prices.push({ vol, price });
            });

            const left = document.getElementById('left-col');
            const right = document.getElementById('right-col');
            const keys = Object.keys(menu);
            
            keys.forEach((cat, i) => {
                let html = `<div class="category-block">`;
                // Если это не "без категории" (не отдельный товар), выводим заголовок
                if (!menu[cat].isSingle) html += `<div class="category-title">${cat}</div>`;
                
                for (let name in menu[cat].items) {
                    const item = menu[cat].items[name];
                    html += `<div class="menu-item">
                        <div>
                            <div class="item-name">${name}</div>
                            <div class="item-description">${item.desc}</div>
                        </div>
                        <div style="display:flex">
                            ${item.prices.map(p => `<div class="price-item"><span class="vol-label">${p.vol}</span>${p.price}</div>`).join('')}
                        </div>
                    </div>`;
                }
                html += `</div>`;
                
                if (i < Math.ceil(keys.length / 2)) left.innerHTML += html;
                else right.innerHTML += html;
            });
        });
    </script>
</body>
</html>
