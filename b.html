<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Меню - Экран 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; overflow: hidden; }
        body, html { width: 100vw; height: 100vh; background-color: #fff; color: #2c3e72; }
        .menu-container { display: flex; width: 100%; height: 100%; }
        .side-column { width: 38%; height: 100%; padding: 40px 50px; position: relative; display: flex; flex-direction: column; }
        .center-column { width: 24%; height: 100%; background-color: #ffcc00; position: relative; display: flex; align-items: center; justify-content: center; }
        .center-column img, .center-column video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .category-block { margin-bottom: 35px; }
        .category-header { display: flex; width: 100%; margin-bottom: 15px; }
        .category-title { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; text-align: left; }
        
        .menu-item { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; margin-bottom: 16px; font-size: 18px; }
        .item-name-block { flex: 1; text-align: left; }
        .item-name { font-weight: bold; color: #2c3e72; }
        .item-description { font-size: 13px; color: #657195; margin-top: 4px; font-weight: normal; line-height: 1.2; padding-right: 15px; }
        
        .special-item { border-top: 2px solid #2c3e72; margin-top: 10px; padding-top: 15px; }
        .special-item .item-name { font-size: 28px; font-weight: 900; text-transform: uppercase; }
        
        .item-prices-block { display: flex; justify-content: flex-end; align-items: flex-start; padding-top: 2px; }
        .price-single { display: block; width: 70px; text-align: right; margin-left: 15px; font-size: 24px; font-weight: 900; color: #2c3e72; line-height: 1; }
        .price-single .vol-label { display: block; font-size: 12px; color: #888; font-weight: normal; margin-bottom: 4px; letter-spacing: 0.5px; }
        
        .addons-block { position: absolute; bottom: 40px; left: 50px; right: 50px; background: #fff; padding-top: 15px; border-top: 2px dashed #2c3e72; }
        .addons-block .category-title { font-size: 22px; color: #2c3e72; margin-bottom: 10px; }
        .addon-item { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 8px; }
        .addon-item .item-name { font-weight: normal; color: #555c70; }
        .addon-item .addon-price { font-size: 18px; font-weight: 900; color: #2c3e72; }
        
        #hint { position: absolute; top: 10px; right: 10px; color: rgba(0,0,0,0.2); font-size: 10px; z-index: 999; cursor: pointer; }
    </style>
</head>
<body onclick="openFullscreen();">
    <div id="hint">Нажмите OK для во весь экран</div>
    <div class="menu-container">
        <div class="side-column" id="left-column"></div>
        <div class="center-column" id="media-block">
            <video id="menu-video" autoplay loop muted playsinline></video>
            <img id="menu-img" alt="">
        </div>
        <div class="side-column" id="right-column"></div>
    </div>
    <script>
        const GOOGLE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuDg_XrAX0YMtbUpwkVOJ3aBWOCKmqELqfqpLB3tcpmSgq5IEKqmZPaEvPma-ZUHGPILwitDcS4nx1/pub?gid=212811701&single=true&output=csv';

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            const categories = {};
            let currentCat = "ОБЩЕЕ";

            lines.forEach((line, index) => {
                if (index === 0) return;
                const cols = line.split(',');
                if (cols.length < 2 || !cols[1].trim()) return;

                let cat = cols[0].trim();
                let name = cols[1].trim();
                let vol = cols[2] ? cols[2].trim() : "";
                let price = cols[3] ? cols[3].trim() : "";
                let desc = cols[4] ? cols[4].trim() : "";
                
                let targetCat = (cat === "") ? "SPECIAL_" + name : cat;
                if (cat !== "" && cat !== "SPECIAL") currentCat = cat;

                if (!categories[targetCat]) categories[targetCat] = { items: [], isSpecial: (cat === "") };
                categories[targetCat].items.push({ name, vol, price, desc });
            });
            return categories;
        }

        function renderMenu(categories) {
            const leftCol = document.getElementById('left-column'), rightCol = document.getElementById('right-column');
            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            
            const keys = Object.keys(categories);
            const half = Math.ceil(keys.length / 2);

            keys.forEach((key, i) => {
                let html = `<div class="category-block">`;
                const cat = categories[key];
                
                if (key.toLowerCase() !== 'добавки' && !cat.isSpecial) {
                    html += `<div class="category-header"><h2 class="category-title">${key}</h2></div>`;
                }

                cat.items.forEach(item => {
                    // Логика вывода: если объема нет, vol-label вообще не создается
                    let volHtml = item.vol ? `<span class="vol-label">${item.vol}</span>` : '';
                    html += `<div class="menu-item ${cat.isSpecial ? 'special-item' : ''}">
                        <div class="item-name-block"><span class="item-name">${item.name}</span><div class="item-description">${item.desc}</div></div>
                        <div class="item-prices-block"><span class="price-single">${volHtml}${item.price}</span></div>
                    </div>`;
                });
                html += `</div>`;

                if (i < half) leftCol.innerHTML += html; else rightCol.innerHTML += html;
            });
        }

        fetch(GOOGLE_CSV_URL + '&t=' + new Date().getTime()).then(r => r.text()).then(t => renderMenu(parseCSV(t)));
    </script>
</body>
</html>
