<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { width: 100vw; height: 100vh; background: #fff; color: #2c3e72; padding: 40px; }
        .menu-container { display: flex; width: 100%; height: 100%; }
        .side-column { width: 45%; }
        .center-column { width: 10%; }
        .category-title { font-size: 28px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        .menu-item { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .item-info { flex: 1; }
        .item-name { font-weight: bold; font-size: 18px; }
        .item-desc { font-size: 13px; color: #666; margin-top: 2px; }
        .prices { display: flex; align-items: flex-start; }
        .price-block { text-align: right; margin-left: 20px; }
        .vol-label { font-size: 11px; color: #999; display: block; margin-bottom: 2px; }
        .price-val { font-size: 22px; font-weight: 900; }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="side-column" id="left-col"></div>
        <div class="center-column"></div>
        <div class="side-column" id="right-col"></div>
    </div>
    <script>
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuDg_XrAX0YMtbUpwkVOJ3aBWOCKmqELqfqpLB3tcpmSgq5IEKqmZPaEvPma-ZUHGPILwitDcS4nx1/pub?gid=212811701&single=true&output=csv&t=' + Date.now();

        fetch(URL).then(r => r.text()).then(text => {
            const lines = text.split(/\r?\n/).slice(1);
            const menu = {}; // Структура: { "Категория": { "Товар": { desc, prices: [] } } }
            let lastCat = "Без категории";

            lines.forEach(line => {
                const [cat, name, vol, price, desc] = line.split(',').map(s => s ? s.trim() : "");
                if (!name) return;
                
                if (cat) lastCat = cat;
                if (!menu[lastCat]) menu[lastCat] = {};
                if (!menu[lastCat][name]) menu[lastCat][name] = { desc: desc, prices: [] };
                
                menu[lastCat][name].prices.push({ vol, price });
            });

            const left = document.getElementById('left-col');
            const right = document.getElementById('right-col');
            const keys = Object.keys(menu);

            keys.forEach((cat, i) => {
                let html = `<div style="margin-bottom:30px;">
                    <div class="category-title">${cat}</div>`;
                
                for (let name in menu[cat]) {
                    const item = menu[cat][name];
                    html += `<div class="menu-item">
                        <div class="item-info">
                            <div class="item-name">${name}</div>
                            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                        </div>
                        <div class="prices">
                            ${item.prices.map(p => `
                                <div class="price-block">
                                    ${p.vol ? `<span class="vol-label">${p.vol}</span>` : ''}
                                    <span class="price-val">${p.price}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                }
                html += `</div>`;
                
                if (i < Math.ceil(keys.length / 2)) left.innerHTML += html;
                else right.innerHTML += html;
            });
        });
    </script>
</body>
</html>
